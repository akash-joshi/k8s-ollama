apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  # tracks all the pods that are part of this deployment by matching it against the template metadata labels
  selector:
    matchLabels:
      name: ollama
  template:
    metadata:
      labels:
        name: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "
                echo 'Waiting for Ollama server to be active...' &&
                while ! ollama list 2>/dev/null | grep -q NAME; do
                  echo 'Ollama server not active yet, retrying...' &&
                  sleep 1;
                done &&
                ollama pull llama3.2
              "]
        ports:
        - containerPort: 11434